<circle class="pk" cx="990.0" cy="110.9" r="7" fill="#ffffff"/><circle cx="990.0" cy="110.9" r="5" fill="#07080a" stroke="#ffffff" stroke-width="2.4"/>
<g class="late"><rect x="1004.0" y="94.9" width="92" height="30" rx="8" fill="#ffffff"/><text x="1050.0" y="114.9" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#07080a">$374K</text></g>
