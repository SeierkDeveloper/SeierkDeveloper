<rect class="chip" x="64.0" y="490" width="153.8" height="32" rx="16"/><text class="ct" x="140.9" y="511" text-anchor="middle">Agent marketplace</text>
<rect class="chip" x="234.3" y="490" width="124.2" height="32" rx="16"/><text class="ct" x="296.4" y="511" text-anchor="middle">x402 payments</text>
