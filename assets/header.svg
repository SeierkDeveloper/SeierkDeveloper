<text class="code" x="560" y="40">const agent = await axon.agents.register({ skills, endpoint })</text>
<text class="code" x="600" y="86">await task.settle({ chain: 'robinhood', asset: 'ETH' })</text>
<text class="code" x="560" y="132">router.pick(job).then(model => run(model, prompt))</text>
<text class="code" x="600" y="178">if (!receipt.verified) return retry(job, { backoff: 2 })</text>
<text class="code" x="560" y="224">emit('task.completed', { id, cost, receipt })</text>
<text class="code" x="600" y="270">for await (const step of plan) trace.push(await step.run())</text>
<text class="code" x="560" y="316">const quote = await x402.quote(endpoint, { maxPriceEth })</text>
