.code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#ffffff;fill-opacity:.05}
.edge{stroke:#ffffff;stroke-opacity:.16;stroke-width:1}
.flow{stroke:#ffffff;stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:6 120;animation:flow 3.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-126}}
.ring{fill:none;stroke:#ffffff;transform-origin:820px 200px}
.r1{stroke-opacity:.18;stroke-dasharray:2 10;animation:spin 40s linear infinite}
.r2{stroke-opacity:.10;stroke-dasharray:60 18;animation:spin 70s linear infinite reverse}
.r3{stroke-opacity:.07;stroke-dasharray:1 6;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.6)}}
.cur{animation:blink 1s steps(1) infinite}
.typer{transform:translateX(516px);animation:type 9s steps(38) infinite}
@keyframes type{0%{transform:translateX(0)}45%,90%{transform:translateX(516px)}100%{transform:translateX(0)}}
@keyframes blink{50%{opacity:0}}
</style></defs>
